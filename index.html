<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구식의 화면 공유 시스템</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* 경고 메시지를 유발하는 Tailwind 대신 순수 CSS 적용 */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* 100% 직각 유지 */
        }
        body {
            background-color: #111827;
            color: #F3F4F6;
            font-family: monospace, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }
        header, footer {
            background-color: #1f2937;
            border-color: #374151;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header { border-bottom: 2px solid #374151; }
        footer { border-top: 2px solid #374151; font-size: 12px; color: #9ca3af; }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .box {
            width: 100%;
            max-width: 600px;
            background-color: #1f2937;
            border: 2px solid #374151;
            padding: 24px;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid;
            color: white;
            margin-top: 10px;
        }
        .btn-blue { background-color: #1d4ed8; border-color: #3b82f6; }
        .btn-blue:hover { background-color: #2563eb; }
        .btn-gray { background-color: #374151; border-color: #4b5563; }
        .btn-gray:hover { background-color: #4b5563; }
        .hidden { display: none !important; }
        video { width: 100%; height: 100%; object-fit: contain; background: black; }
        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
            border: 2px solid #374151;
            margin-top: 12px;
            position: relative;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #111827;
            border: 2px solid #374151;
            color: white;
            font-family: monospace;
            font-size: 16px;
            margin-bottom: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 16px; height: 16px; background: #2563eb;"></div>
            <h1 style="font-size: 16px;">구식의 화면 공유 시스템</h1>
        </div>
        <div style="font-size: 12px; color: #9ca3af;">STATUS: <span id="sys-status" style="color: #4ade80;">READY</span></div>
    </header>

    <main>
        <!-- 1. 메인 선택 화면 -->
        <section id="view-main" class="box">
            <h2 style="font-size: 20px; border-bottom: 2px solid #374151; padding-bottom: 12px; margin-bottom: 12px;">구식의 화면 공유 시스템</h2>
            <p style="font-size: 12px; color: #9ca3af; margin-bottom: 24px;">AI활용하여 만든 화면공유 시스템</p>

            <button id="btn-create" onclick="startHosting()" class="btn btn-blue">방만들기 (PC 전용)</button>
            <button onclick="showViewerInput()" class="btn btn-gray">시청하기</button>

            <div id="mobile-notice" class="hidden" style="margin-top: 16px; padding: 12px; background: #451a03; border: 1px solid #d97706; color: #fde68a; font-size: 12px; text-align: left;">
                * 모바일 기기에서는 [시청하기] 전용 모드로 동작합니다.
            </div>
        </section>

        <!-- 2. 모바일/시청자 방 번호 입력 -->
        <section id="view-viewer-input" class="box hidden">
            <h3 style="margin-bottom: 16px;">접속할 PC 방 번호 입력</h3>
            <input type="text" id="room-code-input" value="1001" placeholder="방 번호 입력 (기본: 1001)">
            <button onclick="startViewing()" class="btn btn-blue">접속하기</button>
            <button onclick="showView('view-main')" class="btn btn-gray">뒤로가기</button>
        </section>

        <!-- 3. 호스트 송출 화면 -->
        <section id="view-host" class="box hidden" style="max-width: 800px;">
            <div style="display: flex; justify-space-between; align-items: center; margin-bottom: 12px;">
                <span style="color: #ef4444; font-weight: bold;">● 실시간 화면 송출 중</span>
                <span style="font-size: 14px;">방 번호: <b id="host-room-id" style="color: #60a5fa;">1001</b></span>
            </div>
            <div class="video-container">
                <video id="host-preview" autoplay playsinline muted></video>
            </div>
        </section>

        <!-- 4. 시청자 라이브 수신 화면 -->
        <section id="view-stream" class="box hidden" style="max-width: 800px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span style="color: #60a5fa; font-weight: bold;">PC 화면 시청 중</span>
                <button onclick="location.reload()" style="padding: 6px 12px; background: #374151; color: white; border: 1px solid #4b5563; cursor: pointer;">나가기</button>
            </div>
            <div class="video-container">
                <video id="remote-video" autoplay playsinline></video>
                <div id="video-overlay" class="hidden" style="position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; items-center; justify-content: center;">
                    <button onclick="playRemoteVideo()" class="btn btn-blue" style="width: auto; padding: 12px 24px;">터치하여 영상 재생</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <span>WebRTC P2P System</span>
        <span id="footer-info">Ready</span>
    </footer>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // PeerJS 연결 설정 (TURN 릴레이 서버 등록)
        const PEER_CONFIG = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
                ]
            }
        };

        let peer = null;
        let localStream = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (isMobile) {
                const btn = document.getElementById('btn-create');
                btn.disabled = true;
                btn.style.opacity = '0.4';
                btn.style.cursor = 'not-allowed';
                btn.onclick = () => alert('화면 공유 송출은 데스크톱(PC) 환경에서만 가능합니다.');
                document.getElementById('mobile-notice').classList.remove('hidden');
            }
        });

        function showView(id) {
            ['view-main', 'view-viewer-input', 'view-host', 'view-stream'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        function showViewerInput() {
            showView('view-viewer-input');
        }

        // --- 호스트 (PC) ---
        async function startHosting() {
            if (isMobile) return;

            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: { max: 30 } },
                    audio: true
                });

                showView('view-host');
                document.getElementById('host-preview').srcObject = localStream;

                // 고정 방 번호: GUSIK_ROOM_1001
                const hostRoomId = "GUSIK_ROOM_1001";
                peer = new Peer(hostRoomId, PEER_CONFIG);

                peer.on('open', () => {
                    document.getElementById('sys-status').innerText = 'HOSTING';
                    document.getElementById('footer-info').innerText = '송출 중 [방 번호: 1001]';
                });

                // 시청자 접속 요청 처리
                peer.on('call', (call) => {
                    call.answer(localStream);
                });

                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        alert('이미 다른 PC에서 1001번 방을 이용 중입니다.');
                        location.reload();
                    }
                });

                localStream.getVideoTracks()[0].onended = () => {
                    alert('화면 공유가 종료되었습니다.');
                    location.reload();
                };

            } catch (err) {
                alert('화면 공유 권한이 거부되었거나 지원되지 않는 브라우저입니다.');
            }
        }

        // --- 시청자 (모바일/PC) ---
        function startViewing() {
            const code = document.getElementById('room-code-input').value.trim() || "1001";
            const targetRoomId = "GUSIK_ROOM_" + code;

            showView('view-stream');
            document.getElementById('sys-status').innerText = 'CONNECTING...';

            const viewerId = "VIEWER_" + Math.random().toString(36).substring(2, 9);
            peer = new Peer(viewerId, PEER_CONFIG);

            peer.on('open', () => {
                const call = peer.call(targetRoomId, null);

                call.on('stream', (remoteStream) => {
                    document.getElementById('sys-status').innerText = 'CONNECTED';
                    const video = document.getElementById('remote-video');
                    video.srcObject = remoteStream;

                    video.play().catch(() => {
                        document.getElementById('video-overlay').classList.remove('hidden');
                    });
                });

                call.on('error', () => {
                    alert('해당 방 번호(' + code + ')의 PC를 찾을 수 없습니다. PC에서 먼저 [방만들기]를 눌렀는지 확인하세요.');
                    location.reload();
                });
            });
        }

        function playRemoteVideo() {
            document.getElementById('remote-video').play();
            document.getElementById('video-overlay').classList.add('hidden');
        }
    </script>
</body>
</html>
