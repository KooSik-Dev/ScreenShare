<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구식의 화면 공유 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        *, *::before, *::after {
            border-radius: 0 !important;
        }
        body {
            background-color: #111827;
            color: #F3F4F6;
            font-family: monospace, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

    <!-- 상단 헤더 -->
    <header class="bg-gray-900 border-b-2 border-gray-700 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-4 h-4 bg-blue-600"></div>
            <h1 class="font-bold text-lg tracking-wider text-gray-100">구식의 화면 공유 시스템</h1>
        </div>
        <div class="text-xs text-gray-400 bg-gray-800 border border-gray-700 px-3 py-1">
            STATUS: <span id="sys-status" class="text-green-400 font-bold">READY</span>
        </div>
    </header>

    <!-- 메인 영역 -->
    <main class="flex-1 flex flex-col items-center justify-center p-4">

        <!-- 1. 메인 선택 화면 -->
        <section id="view-main" class="w-full max-w-xl bg-gray-900 border-2 border-gray-700 p-8 text-center">
            <h2 class="text-2xl font-bold mb-2 text-white border-b-2 border-gray-800 pb-4">구식의 화면 공유 시스템</h2>
            <p class="text-sm text-gray-400 mb-8 mt-2">AI활용하여 만든 화면공유 시스템</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button id="btn-create-room" onclick="startHosting()" class="bg-blue-700 hover:bg-blue-600 text-white font-bold py-5 px-4 border-2 border-blue-500 text-lg">
                    방만들기
                </button>
                <button id="btn-view-rooms" onclick="startViewing()" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-5 px-4 border-2 border-gray-600 text-lg">
                    시청하기
                </button>
            </div>

            <div id="mobile-notice" class="hidden mt-6 p-3 bg-yellow-900/40 border border-yellow-600 text-yellow-200 text-xs text-left">
                * 모바일 기기에서는 [시청하기] 전용 모드로 동작합니다.
            </div>
        </section>

        <!-- 2. 호스트 PC 송출 화면 -->
        <section id="view-host" class="hidden w-full max-w-4xl bg-gray-900 border-2 border-gray-700 p-6">
            <div class="flex items-center justify-between border-b-2 border-gray-800 pb-3 mb-4">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 bg-red-500 animate-pulse"></span>
                    <span class="font-bold text-red-400">실시간 화면 송출 중</span>
                </div>
                <div class="text-xs text-gray-400">
                    채널: <span class="text-green-400 font-bold">MAIN_PC</span>
                </div>
            </div>

            <div class="bg-black border-2 border-gray-800 w-full aspect-video flex items-center justify-center overflow-hidden">
                <video id="host-preview" autoplay playsinline muted class="w-full h-full object-contain"></video>
            </div>
        </section>

        <!-- 3. 시청 모드 (학생컴 관제실 그리드) -->
        <section id="view-viewer-list" class="hidden w-full max-w-6xl">
            <div class="bg-gray-900 border-2 border-gray-700 p-4 mb-4 flex items-center justify-between">
                <h3 class="font-bold text-gray-200 flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500"></span>
                    송출 중인 PC 목록
                </h3>
                <button onclick="checkPcOnline()" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 text-xs px-3 py-1 font-bold">
                    목록 새로고침
                </button>
            </div>

            <div id="pc-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- JS 생성 카드 -->
            </div>

            <div id="no-pc-msg" class="hidden bg-gray-900 border-2 border-gray-800 p-12 text-center text-gray-500">
                현재 송출 중인 PC가 없습니다. (PC에서 [방만들기]를 먼저 누르세요)
            </div>
        </section>

        <!-- 4. 실시간 방송 시청 -->
        <section id="view-stream" class="hidden w-full max-w-5xl bg-gray-900 border-2 border-gray-700 p-4">
            <div class="flex items-center justify-between border-b-2 border-gray-800 pb-3 mb-4">
                <span class="font-bold text-blue-400">PC_1 실시간 화면</span>
                <button onclick="backToGrid()" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 text-xs px-4 py-2 font-bold text-gray-200">
                    목록으로 돌아가기
                </button>
            </div>

            <div class="relative bg-black border-2 border-gray-800 w-full aspect-video flex items-center justify-center overflow-hidden">
                <video id="remote-video" autoplay playsinline class="w-full h-full object-contain"></video>
                <div id="video-overlay" class="hidden absolute inset-0 bg-black/80 flex items-center justify-center">
                    <button onclick="playRemoteVideo()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 border-2 border-blue-400">
                        터치하여 화면 보기
                    </button>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-gray-900 border-t-2 border-gray-800 px-4 py-2 text-xs text-gray-500 flex justify-between items-center">
        <span>WebRTC P2P System</span>
        <span id="footer-info">Ready</span>
    </footer>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // 고정 채널 ID 지정
        const HOST_ROOM_ID = "GUSIK_SHARE_MAIN_HOST";

        const PEER_CONFIG = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
                ]
            }
        };

        let peer = null;
        let localStream = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (isMobile) {
                const createBtn = document.getElementById('btn-create-room');
                createBtn.disabled = true;
                createBtn.classList.add('opacity-40', 'cursor-not-allowed');
                createBtn.onclick = () => alert('화면 공유 송출은 데스크톱(PC) 환경에서만 가능합니다.');
                document.getElementById('mobile-notice').classList.remove('hidden');
            }
        });

        function showView(viewId) {
            ['view-main', 'view-host', 'view-viewer-list', 'view-stream'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        // --- 1. 방만들기 (PC) ---
        async function startHosting() {
            if (isMobile) return;

            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: { max: 30 } },
                    audio: true
                });

                showView('view-host');
                document.getElementById('host-preview').srcObject = localStream;

                // 고정 ID로 호스트 생성
                peer = new Peer(HOST_ROOM_ID, PEER_CONFIG);

                peer.on('open', () => {
                    document.getElementById('sys-status').innerText = 'HOSTING';
                    document.getElementById('footer-info').innerText = '송출 중 [MAIN_PC]';
                });

                peer.on('call', (call) => {
                    call.answer(localStream);
                });

                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        alert('이미 다른 PC에서 화면 공유를 송출 중입니다.');
                        location.reload();
                    }
                });

                localStream.getVideoTracks()[0].onended = () => {
                    alert('화면 공유가 종료되었습니다.');
                    location.reload();
                };

            } catch (err) {
                alert('화면 공유 권한이 거부되었거나 지원되지 않는 브라우저입니다.');
            }
        }

        // --- 2. 시청하기 (모바일/PC) ---
        function startViewing() {
            showView('view-viewer-list');
            document.getElementById('sys-status').innerText = 'VIEWER_MODE';

            const viewerId = "VIEWER_" + Math.random().toString(36).substring(2, 9);
            peer = new Peer(viewerId, PEER_CONFIG);

            peer.on('open', () => {
                checkPcOnline();
            });
        }

        // 호스트 온라인 상태 확인 후 목록 카드 생성
        function checkPcOnline() {
            if (!peer) return;

            // 데이터 연결로 호스트 생존 여부 테스트
            const conn = peer.connect(HOST_ROOM_ID);
            let isOnline = false;

            const timer = setTimeout(() => {
                if (!isOnline) {
                    conn.close();
                    document.getElementById('pc-grid').innerHTML = '';
                    document.getElementById('no-pc-msg').classList.remove('hidden');
                }
            }, 3000);

            conn.on('open', () => {
                isOnline = true;
                clearTimeout(timer);
                conn.close();
                renderPcCard();
            });
        }

        function renderPcCard() {
            document.getElementById('no-pc-msg').classList.add('hidden');
            const grid = document.getElementById('pc-grid');
            grid.innerHTML = `
                <div onclick="connectToPc()" class="bg-gray-900 border-2 border-gray-700 p-2 cursor-pointer hover:border-blue-500">
                    <div class="bg-black border border-gray-800 aspect-video flex items-center justify-center mb-2">
                        <span class="text-xs text-blue-400 font-bold">| PC 1 |</span>
                    </div>
                    <div class="flex items-center justify-between text-xs border-t border-gray-800 pt-2">
                        <span class="font-bold text-gray-300">PC_1 (메인)</span>
                        <span class="text-green-400 font-bold">LIVE</span>
                    </div>
                </div>
            `;
        }

        // --- 3. 라이브 시청 연결 ---
        function connectToPc() {
            showView('view-stream');
            const call = peer.call(HOST_ROOM_ID, null);

            call.on('stream', (remoteStream) => {
                const remoteVideo = document.getElementById('remote-video');
                remoteVideo.srcObject = remoteStream;
                remoteVideo.play().catch(() => {
                    document.getElementById('video-overlay').classList.remove('hidden');
                });
            });

            call.on('error', () => {
                alert('PC 화면을 불러올 수 없습니다.');
                backToGrid();
            });
        }

        function playRemoteVideo() {
            document.getElementById('remote-video').play();
            document.getElementById('video-overlay').classList.add('hidden');
        }

        function backToGrid() {
            showView('view-viewer-list');
            const remoteVideo = document.getElementById('remote-video');
            if (remoteVideo.srcObject) {
                remoteVideo.srcObject.getTracks().forEach(t => t.stop());
                remoteVideo.srcObject = null;
            }
        }
    </script>
</body>
</html>
